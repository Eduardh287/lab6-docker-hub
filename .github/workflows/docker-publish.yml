name: Build, Test, and Push to Docker Hub

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and Test
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pytest

  build-and-push:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Check Docker Hub auth
        env:
          U: ${{ secrets.DOCKERHUB_USERNAME }}
          T: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "user_len=${#U}"
          code=$(curl -s -o /tmp/r.json -w '%{http_code}' -u "$U:$T" "https://auth.docker.io/token?service=registry.docker.io&scope=repository:$U/lab6-docker-hub:push,pull")
          echo "auth_http=$code"
          python3 -c "import json;d=json.load(open('/tmp/r.json'));print('auth_keys',sorted(d.keys()));print('auth_detail',d.get('details') or d.get('errors') or '')"
          code2=$(curl -s -o /tmp/l.json -w '%{http_code}' -H 'Content-Type: application/json' -d "{\"identifier\":\"$U\",\"secret\":\"$T\"}" https://hub.docker.com/v2/auth/token)
          echo "hub_login_http=$code2"
          python3 -c "import json;d=json.load(open('/tmp/l.json'));print('hub_keys',sorted(d.keys()));print('hub_detail',d.get('detail') or d.get('message') or '')"
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/lab6-docker-hub:latest
