name: Build, Test, and Push to Docker Hub

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install and Test
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pytest

  build-and-push:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v3
      - name: Check token format
        env:
          T: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "length=${#T}"
          case "$T" in dckr_pat_*) echo "prefix ok";; *) echo "prefix WRONG";; esac
          if printf '%s' "$T" | grep -q '[[:space:]]'; then echo "has whitespace"; else echo "no whitespace"; fi
          if printf '%s' "$T" | LC_ALL=C grep -q '[^ -~]'; then echo "has non-ASCII"; else echo "ascii only"; fi
          echo "lines=$(printf '%s' "$T" | wc -l)"
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push to Docker Hub
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/lab6-docker-hub:latest
